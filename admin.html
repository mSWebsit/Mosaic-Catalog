<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mosaic Event</title>
    <link rel="stylesheet" href="adminStyle.css">
</head>
<body>

    <div id="loginBox" class="admin-container">
        <a href="index.html" class="back-link">← Back to Website</a>
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button id="doLogin" class="primary-btn">Sign In</button>
    </div>

    <div id="adminPanel" class="admin-container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <a href="index.html" class="back-link">← Website</a>
            <h2 style="margin:0; border:none;">Dashboard</h2>
            <div style="width:60px;"></div>
        </div>
        
        <label>Product Name</label>
        <input type="text" id="title" placeholder="e.g. Elegant Wedding Arch">
        
        <label>Category</label>
        <select id="cat">
            <option value="wedding">Wedding</option>
            <option value="engagement">Engagement</option>
            <option value="birthday">Birthday</option>
            <option value="graduation">Graduations</option>
            <option value="gender-reveal">Gender Reveal</option>
            <option value="fresh-bouquet">Fresh Flowers</option>
            <option value="silk-bouquet">Silk Flowers</option>
            <option value="natural-plant">Natural Plants</option>
            <option value="rental">Rentals</option>
        </select>

        <div class="tag-container">
            <p style="font-size:0.8rem; font-weight:bold; margin-bottom:10px;">Select Tags:</p>
            <div class="tag-grid">
                <div class="admin-tag-pill">Fresh</div><div class="admin-tag-pill">Silk</div>
                <div class="admin-tag-pill">Natural</div><div class="admin-tag-pill">Luxury</div>
                <div class="admin-tag-pill">Roses</div><div class="admin-tag-pill">Potted</div>
            </div>
        </div>

        <label>Includes (Separate items with commas)</label>
        <textarea id="inc" placeholder="12 Roses, Velvet Box, Personalized Card..."></textarea>
        
        <label>Direct Image Link (from PostImages.org)</label>
        <input type="text" id="imgUrl" placeholder="https://i.postimg.cc/xxxx/image.jpg">
        
        <button id="upBtn" class="primary-btn">Publish to Catalog</button>

        <h3 style="border-top:1px solid #eee; padding-top:20px;">Live Catalog Items</h3>
        <div id="itemList"></div>
        <button id="doLogout" style="width:100%; background:none; border:none; color:#999; margin-top:20px; cursor:pointer;">Sign Out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const cfg = { 
            apiKey: "AIzaSyDuNCOMv1g7j0EXTT_dDRlwYWganwSh3Fs", 
            authDomain: "mosaic-6a2fc.firebaseapp.com", 
            projectId: "mosaic-6a2fc", 
            storageBucket: "mosaic-6a2fc.firebasestorage.app", 
            messagingSenderId: "873883257365", 
            appId: "1:873883257365:web:7b20b9bbb1c9aac08adc1c" 
        };

        const app = initializeApp(cfg); const auth = getAuth(app); const db = getFirestore(app);

        // Fixed Tag Selection Logic
        document.querySelectorAll('.admin-tag-pill').forEach(p => {
            p.onclick = () => p.classList.toggle('active');
        });

        document.getElementById('doLogin').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value).catch(() => alert("Access Denied"));
        };
        document.getElementById('doLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, u => {
            document.getElementById('loginBox').classList.toggle('hidden', !!u);
            document.getElementById('adminPanel').classList.toggle('hidden', !u);
            if(u) {
                onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), s => {
                    const l = document.getElementById('itemList'); l.innerHTML = "";
                    s.forEach(d => {
                        const i = d.data();
                        l.innerHTML += `<div class="item-row"><img src="${i.image}"><div class="item-info"><span>${i.title}</span></div><div class="delete-link" onclick="window.del('${d.id}')">Delete</div></div>`;
                    });
                });
            }
        });

        document.getElementById('upBtn').onclick = async () => {
            const imgUrl = document.getElementById('imgUrl').value;
            const title = document.getElementById('title').value;
            if(!imgUrl || !title) return alert("Title and Direct Image Link are required");

            const tags = Array.from(document.querySelectorAll('.admin-tag-pill.active')).map(p => p.innerText);
            document.getElementById('upBtn').innerText = "Publishing...";

            try {
                await addDoc(collection(db, "products"), { 
                    title: title, 
                    category: document.getElementById('cat').value, 
                    tags: tags, 
                    includes: document.getElementById('inc').value, 
                    image: imgUrl, 
                    createdAt: Date.now() 
                });
                location.reload();
            } catch (e) { alert("Error saving product."); document.getElementById('upBtn').innerText = "Publish to Catalog"; }
        };

        window.del = (id) => { if(confirm("Permanently delete this item?")) deleteDoc(doc(db, "products", id)); };
    </script>
</body>
</html>
